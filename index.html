<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campus Food Menu</title>
    <style>
        body {
            margin: 2rem;
            font-family: sans-serif;
        }

        .toolbar {
            margin-bottom: 1rem;
        }

        input, button {
            font: inherit;
            padding: 0.5rem;
            border: 1px solid #ccc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 0.5rem;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

    <h1>Campus Food Menu</h1>

    <div class="toolbar">
        <button onclick="loadAllMeals()">Load All Meals</button>

        <form id="searchForm">
            <input type="text" id="searchInput" placeholder="Search by ID">
            <button type="submit">Search</button>
        </form>
    </div>

    <table id="mealTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody id="mealTableBody">
        </tbody>
    </table>

    <script>

    async function loadAllMeals() {
        const response = await fetch('api/meals');
        const meals = await response.json();
        renderMeals(meals);
    }

    function renderMeals(meals) {
        const tbody = document.getElementById('mealTableBody');
        tbody.innerHTML = "";

        meals.forEach(meal => {
            const row = document.createElement("tr");

            row.innerHTML =
                "<td>" + meal.id + "</td>" +
                "<td>" + meal.name + "</td>" +
                "<td>" + meal.price + "</td>";

            tbody.appendChild(row);
        });
    }

    document.getElementById('searchForm').addEventListener('submit', async function (event) {
        event.preventDefault();

        const id = document.getElementById('searchInput').value;
        const response = await fetch('api/meals/' + id);
        const meal = await response.json();

        renderMeals([meal]);
    });

    </script>


</body>
</html>
